services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: etm
      POSTGRES_PASSWORD: etm_secret
      POSTGRES_DB: event_ticket
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etm -d event_ticket"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
